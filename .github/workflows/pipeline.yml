# Lint, test and build every PR and push to main. On main, also publish the
# runtime image to GHCR and deploy to Vercel production (migrations first;
# a failed migration stops the deploy). All steps run in the Dockerfile.
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Lint
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lint
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Unit tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build integration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: integration
          load: true
          tags: inkwell-integration:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Integration tests
        run: docker compose -f docker-compose.ci.yml run --rm integration
      - name: Tear down Postgres
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  build:
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inkwell" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One deploy at a time, and never cancel one mid-migration.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build deployer image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deployer
          load: true
          tags: inkwell-deployer
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate and deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: >-
          docker run --rm
          -e VERCEL_TOKEN -e VERCEL_ORG_ID -e VERCEL_PROJECT_ID -e DIRECT_DATABASE_URL
          inkwell-deployer
